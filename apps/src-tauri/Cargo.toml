[package]
name = "leaflet"
version = "1.5.14"
edition = "2021"
build = "build.rs"

# Android and iOS load the app as a shared library from their own host activity
# instead of starting a Rust binary, so the crate has to produce one. The desktop
# binary links the same `rlib`, so there is a single implementation.
[lib]
name = "leaflet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# A phone downloads this binary; a desktop only unpacks it once. The debug APK
# was 206 MB and nearly all of it was symbols nobody ships.
#
# Cargo has no per-platform profiles, so these apply to the desktop release too.
# Every setting here is therefore one that costs nothing behaviourally:
#
#   `opt-level = "s"` was tried and dropped -- it would slow the hashing and
#   conversion work on desktop to save a little size on mobile.
#
#   `panic = "abort"` was tried and dropped for a sharper reason: the import
#   path turns a panicking `spawn_blocking` task into "Import task failed"
#   rather than taking the app down, and Leaflet parses arbitrary user files,
#   which is exactly where a panic comes from.
[profile.release]
# The single biggest saving, and it costs nothing at runtime.
strip = "symbols"
# Whole-program optimisation, which also drops code no path can reach -- so the
# desktop-only branches compiled out below leave nothing behind. Usually makes
# the result faster as well as smaller.
lto = true
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Ed25519 check of the signed server config (already in the tree via rustls).
ring = "0.17"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
# Compresses the sync document before it is stored. JSON with repeated keys
# and ISO timestamps packs about 6:1, which is what keeps a free-tier cluster
# viable at a few thousand readers.
flate2 = "1"
oauth2 = { version = "4.4", default-features = false }
quick-xml = "0.31"
# `gzip`: asks for gzip and unpacks it, so the Leaflet server's answers (the
# board, profiles, the sync document's base64) come compressed, as its Caddy
# offers. Bodies are the same bytes once unpacked; only `content_length()`
# goes (None for a gzipped answer), and nothing leans on it but the wiki's
# early check, which reads under its limit anyway (`wiki::ask`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "gzip"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read back is the number written. Without it a
# day's minutes (a sum of fractions, 9.748933333333333) could come back from
# JSON a step short, and the sync document never read back as what was sent:
# Drive's check after a write failed every round ("Another device is
# syncing right now"), and the account was sent the same document at every
# sync (2026-10-21).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
urlencoding = "2.1"
zip = "0.6"
dirs = "4"
tauri-plugin-dialog = "2.5.6"
# Opens the OAuth consent page in the system browser. Google refuses to run its
# sign-in inside an embedded webview, so `window.open` from the frontend could
# never have worked.
tauri-plugin-opener = "2"
# Keeps the Drive refresh token in the OS credential store rather than a
# plaintext column in the library database.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dotenvy = "0.15"
base64 = "0.22"
regex = "1.10"
# The time zone's name, for the half of the world the reader is in (Pip's Frost
# skin is earned on the longest night: December in the north, June in the
# south). Already in the tree through chrono.
iana-time-zone = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The Studio voice's pack (src/tts/packs.rs): the model archive is a .tar.bz2. bzip2 is
# the version zip already builds; tar is small and pure Rust. Every platform:
# Android's Kotlin reads the files this downloads.
bzip2 = "0.4"
tar = { version = "0.4", default-features = false }

# Focuses an already-running window when a second launch arrives with a file.
# A phone has no such concept and the plugin has no mobile implementation.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

# The phone's sign-in sealed by the Android Keystore (src/sync/device_secret.rs):
# Rust calls SecretBox.kt by JNI. Same version wry already builds on Android.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# The Studio voice's engine on Windows (src/tts/native.rs), behind the `studio-voice`
# feature. sherpa-onnx (Apache-2.0) runs Kokoro through onnxruntime: `shared`
# puts sherpa-onnx-c-api.dll and onnxruntime.dll next to the exe (the static
# build links the C runtime statically, which Rust's default does not). Its
# build script fetches the prebuilt archive unless SHERPA_ONNX_ARCHIVE_DIR
# points at a copy: .cargo/config.toml points it at vendor/sherpa-onnx
# (docs/studio-voice.md). cpal plays the sound (WASAPI); same `windows`
# crate range as ours.
[target.'cfg(windows)'.dependencies.sherpa-onnx]
version = "=1.13.8"
default-features = false
features = ["shared"]
optional = true

[target.'cfg(windows)'.dependencies.cpal]
version = "0.17"
optional = true

# Reading reminders (src/reminders/toast.rs): Windows toasts, shown now or
# scheduled with Windows for when the app is closed. Called directly because
# the notification plugin can neither schedule nor use the MSIX identity.
# Same version Tauri already builds, so this adds features, not a crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Storage_Packaging_Appx",
  # Desktop Pip (src/desktop_pip/win.rs): whether the mouse button is still
  # down, and Windows' own "a full-screen app or a presentation is running".
  # Keeping the display on while the page reads itself (commands/power.rs).
  "Win32_System_Power",
  # Loading the Studio voice's DLLs by full path (src/tts/native.rs).
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }
# Which Windows build, for Mica (src/window_material.rs). The version Tauri's
# window effects already build on, so no new crate.
windows-version = "0.1.7"
# Emptying the web view's disk cache (src/commands/space.rs). The version wry
# already builds on, so no new crate.
webview2-com = "0.38"

# No `protocol-asset`: covers and book bytes reach the webview through commands,
# so nothing needs `asset://`, and leaving it on exposed the whole app-data
# folder (library database included) to any script running in the webview.
[dependencies.tauri]
version = "2.5.6"
features = []

[features]
# The Studio voice's engine (Windows only: elsewhere it has no effect, and
# Android speaks in Kotlin). On by default; `--no-default-features` builds
# without it, and the voice is then never offered on the desktop.
default = ["studio-voice"]
studio-voice = ["dep:sherpa-onnx", "dep:cpal"]
custom-protocol = ["tauri/custom-protocol"]
