# Publishes Leaflet's website (site/) to GitHub Pages:
#   https://itsadithyakv.github.io/Leaflet-BookReader/
# The desktop app reads config.json from there, so a broken deploy never
# breaks installed apps: they keep their last good (signed) config.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/legal/**"
      - "apps/src/assets/pip/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
